<rect x="528" y="114" width="156" height="98" rx="6" fill="#f1e7e4" stroke="#bf4520" stroke-width="1"/>
<rect x="538" y="124" width="28" height="15" rx="2" fill="transparent" stroke="#bf4520" stroke-width="0.8"/>
<text x="552" y="135" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#bf4520">M4</text>
<text x="538" y="157" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Gate:</text>
<text x="538" y="171" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">tugas masuk</text>
<text x="538" y="200" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ tugas dikirim</text>
<text x="24" y="244" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.16em" fill="#5a6580">FASE KELAS — 3 KELAS, KELOMPOK 3–5</text>
<line x1="24" y1="251" x2="696" y2="251" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<rect x="24" y="264" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="24" y="264" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="34" y="274" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="48" y="285" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M5</text>
<text x="34" y="307" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Dasar materi</text>
<text x="34" y="321" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">pertama</text>
<text x="34" y="350" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ 1 karya dasar</text>
<rect x="192" y="264" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="192" y="264" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="202" y="274" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="216" y="285" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M6</text>
<text x="202" y="307" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Dokumen kerja</text>
<text x="202" y="321" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">&amp; daftar tugas</text>
<text x="202" y="350" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ GDD / dok teknis</text>
<rect x="360" y="264" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="360" y="264" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="370" y="274" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="384" y="285" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M7</text>
<text x="370" y="307" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Mengerjakan</text>
<text x="370" y="321" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">bagian inti</text>
<text x="370" y="350" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ sistem jalan</text>
<rect x="528" y="264" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="528" y="264" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="538" y="274" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="552" y="285" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M8</text>
<text x="538" y="307" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Uji, rapikan,</text>
<text x="538" y="321" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">kemas</text>
<text x="538" y="350" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ artefak + README</text>
<line x1="24" y1="382" x2="696" y2="382" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="24" y="400" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" fill="#5a6580">Gate bukan ujian kemampuan: alat siap, mau mengerjakan, kirim sebelum tenggat.</text>
