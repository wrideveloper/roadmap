<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="860" height="380" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <text x="430" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Single Point of Failure (SPOF) pada Single-Server
  </text>
  <text x="430" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Ketika semua komponen ditumpuk di satu mesin, satu kegagalan kecil mematikan seluruh sistem
  </text>

  <!-- Client Box -->
  <g transform="translate(50, 140)" filter="url(#shadow)">
    <rect width="160" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="24" rx="6" fill="#0369a1"/>
    <text x="80" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">
      CLIENTS
    </text>
    <text x="80" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f8fafc">
      Web Browser
    </text>
    <text x="80" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f8fafc">
      Mobile Apps
    </text>
    <text x="80" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      Ribuan Pengguna
    </text>
  </g>

  <!-- Arrow from Client to Server -->
  <g stroke="#ef4444" stroke-width="2" fill="none">
    <line x1="210" y1="205" x2="310" y2="205"/>
    <polygon points="310,200 320,205 310,210" fill="#ef4444"/>
  </g>
  <text x="265" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f87171">
    All Traffic
  </text>

  <!-- Big Server Box (SPOF) -->
  <g transform="translate(320, 100)" filter="url(#shadow)">
    <!-- Outer Box -->
    <rect width="490" height="210" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    
    <rect x="20" y="-12" width="220" height="24" rx="12" fill="#7f1d1d"/>
    <text x="130" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">
      SINGLE VPS / INSTANCE (SPOF)
    </text>

    <!-- Component 1: Web App -->
    <g transform="translate(25, 30)">
      <rect width="130" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="65" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Web App</text>
      <text x="65" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Laravel / Go / Node</text>
      <line x1="20" y1="75" x2="110" y2="75" stroke="#334155"/>
      <text x="65" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ef4444">CPU 100%</text>
      <text x="65" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ef4444">Memory Leak</text>
    </g>

    <!-- Component 2: Database -->
    <g transform="translate(180, 30)">
      <rect width="130" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="65" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Database</text>
      <text x="65" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">MySQL / PostgreSQL</text>
      <line x1="20" y1="75" x2="110" y2="75" stroke="#334155"/>
      <text x="65" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ef4444">Max Connection</text>
      <text x="65" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ef4444">Disk I/O Bottleneck</text>
    </g>

    <!-- Component 3: Assets & Cache -->
    <g transform="translate(335, 30)">
      <rect width="130" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="65" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a855f7">Storage</text>
      <text x="65" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Uploads &amp; Files</text>
      <line x1="20" y1="75" x2="110" y2="75" stroke="#334155"/>
      <text x="65" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ef4444">Disk Penuh</text>
      <text x="65" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ef4444">No Backup</text>
    </g>
  </g>

  <!-- Bottom Warning Banner -->
  <rect x="50" y="325" width="760" height="36" rx="6" fill="#7f1d1d" opacity="0.4"/>
  <text x="430" y="347" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">
    Dampak SPOF: Jika server ini down 10 detik saja, 100% pengguna langsung terputus dan bisnis berhenti total.
  </text>
</svg>
