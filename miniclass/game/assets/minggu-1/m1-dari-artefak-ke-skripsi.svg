<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-labelledby="dari-artefak-ke-skripsi-title dari-artefak-ke-skripsi-desc">
  <title id="dari-artefak-ke-skripsi-title">Lima langkah dari artefak game ke tugas akhir</title>
  <desc id="dari-artefak-ke-skripsi-desc">Alur lima kotak: artefak, pertanyaan riset, metode, evaluasi, dan dokumen tugas akhir.</desc>
  <rect width="720" height="210" fill="#f5f5f5"/>
<text x="24" y="26" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.16em" fill="#5a6580">JALUR TUGAS AKHIR</text>
<text x="24" y="52" font-family="'Instrument Serif', 'Liberation Serif', Georgia, serif" font-size="22" fill="#2d3142">Dari artefak ke pertanyaan riset</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<line x1="147" y1="120.0" x2="155" y2="120.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="279" y1="120.0" x2="287" y2="120.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="411" y1="120.0" x2="419" y2="120.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="543" y1="120.0" x2="551" y2="120.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="24" y="86" width="122" height="68" rx="6" fill="#f5f5f5"/>
<rect x="24" y="86" width="122" height="68" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<text x="85.0" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Artefak</text>
<text x="85.0" y="132" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">bisa dibuka</text>
<text x="85.0" y="166" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#5a6580">LANGKAH 1</text>
<rect x="156" y="86" width="122" height="68" rx="6" fill="#f5f5f5"/>
<rect x="156" y="86" width="122" height="68" rx="6" fill="#f1e7e4" stroke="#bf4520" stroke-width="1"/>
<text x="217.0" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Pertanyaan</text>
<text x="217.0" y="132" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">bisa diukur</text>
<text x="217.0" y="166" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#5a6580">LANGKAH 2</text>
<rect x="288" y="86" width="122" height="68" rx="6" fill="#f5f5f5"/>
<rect x="288" y="86" width="122" height="68" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<text x="349.0" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Metode</text>
<text x="349.0" y="132" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">bisa diulang</text>
<text x="349.0" y="166" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#5a6580">LANGKAH 3</text>
<rect x="420" y="86" width="122" height="68" rx="6" fill="#f5f5f5"/>
<rect x="420" y="86" width="122" height="68" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<text x="481.0" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Evaluasi</text>
<text x="481.0" y="132" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">data, bukan opini</text>
<text x="481.0" y="166" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#5a6580">LANGKAH 4</text>
<rect x="552" y="86" width="122" height="68" rx="6" fill="#f5f5f5"/>
<rect x="552" y="86" width="122" height="68" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<text x="613.0" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Dokumen</text>
<text x="613.0" y="132" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">bab 1–5</text>
<text x="613.0" y="166" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#5a6580">LANGKAH 5</text>
<text x="24" y="188" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" fill="#5a6580">Game hanya salah satu artefak. Yang menentukan: pertanyaan dan buktinya.</text>
