<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
  <title>Strategi Canary: Traffic naik bertahap 10% ke 50% hingga 100%</title>
  <desc>Pengguna mengirim request ke load balancer. Mula-mula 10% request diarahkan ke v2 (canary) dan 90% ke v1 (stabil). Setelah metrik aman, v2 menerima 50%, lalu 100%.</desc>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .p {
      opacity: 0;
      animation-duration: 2s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .c { animation-name: goC; }
    .u { animation-name: goU; }
    .d { animation-name: goD; }

    /* Smooth cross-fade stage transitions (12s loop) */
    .s1 { animation: stage1 12s ease-in-out infinite; }
    .s2 { animation: stage2 12s ease-in-out infinite; }
    .s3 { animation: stage3 12s ease-in-out infinite; }

    /* Group visibility for packets per stage */
    .v100 { animation: v100 12s step-end infinite; }
    .v010 { animation: v010 12s step-end infinite; }
    .v001 { animation: v001 12s step-end infinite; }
    .v110 { animation: v110 12s step-end infinite; }
    .v011 { animation: v011 12s step-end infinite; }
    .v111 { animation: v111 12s step-end infinite; }

    @keyframes goC {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      3%   { opacity: 1; }
      22%  { opacity: 1; }
      25%  { opacity: 0; transform: translate(140px, 0px); }
      100% { opacity: 0; transform: translate(140px, 0px); }
    }
    @keyframes goU {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      3%   { opacity: 1; }
      22%  { opacity: 1; }
      25%  { opacity: 0; transform: translate(160px, -80px); }
      100% { opacity: 0; transform: translate(160px, -80px); }
    }
    @keyframes goD {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      3%   { opacity: 1; }
      22%  { opacity: 1; }
      25%  { opacity: 0; transform: translate(160px, 84px); }
      100% { opacity: 0; transform: translate(160px, 84px); }
    }

    @keyframes stage1 {
      0%, 30%   { opacity: 1; }
      34%, 96%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes stage2 {
      0%, 31%   { opacity: 0; }
      35%, 63%  { opacity: 1; }
      67%, 100% { opacity: 0; }
    }
    @keyframes stage3 {
      0%, 64%   { opacity: 0; }
      68%, 96%  { opacity: 1; }
      100%      { opacity: 0; }
    }

    @keyframes v001 { 0% { opacity: 0; } 33.33% { opacity: 0; } 66.66% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes v010 { 0% { opacity: 0; } 33.33% { opacity: 1; } 66.66% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes v011 { 0% { opacity: 0; } 33.33% { opacity: 1; } 66.66% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes v100 { 0% { opacity: 1; } 33.33% { opacity: 0; } 66.66% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes v110 { 0% { opacity: 1; } 33.33% { opacity: 1; } 66.66% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes v111 { 0% { opacity: 1; } 33.33% { opacity: 1; } 66.66% { opacity: 1; } 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .p, .v100, .v010, .v001, .v110, .v011, .v111, .s1, .s3 {
        animation: none !important;
        opacity: 0;
      }
      .s2 {
        animation: none !important;
        opacity: 1;
      }
    }
  </style>

  <rect width="800" height="400" rx="18" fill="#0f172a"/>

  <!-- Header -->
  <text x="32" y="40" font-size="18" font-weight="700" fill="#e2e8f0">Strategi Canary: traffic naik bertahap</text>
  <g class="s1"><text x="32" y="66" font-size="14" font-weight="500" fill="#94a3b8">Tahap 1 · canary baru menerima 10% traffic</text></g>
  <g class="s2"><text x="32" y="66" font-size="14" font-weight="500" fill="#fbbf24">Tahap 2 · metrik aman, porsi dinaikkan ke 50%</text></g>
  <g class="s3"><text x="32" y="66" font-size="14" font-weight="500" fill="#34d399">Tahap 3 · promosi penuh: v2 menerima 100%</text></g>

  <!-- Dashed Paths -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <line x1="160" y1="202" x2="300" y2="202"/>
    <line x1="430" y1="190" x2="590" y2="110"/>
    <line x1="430" y1="214" x2="590" y2="298"/>
  </g>

  <!-- Incoming Packets -->
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.0s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.1s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.2s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.3s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.4s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.5s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.6s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.7s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.8s"/>
  <circle class="p c" cx="160" cy="202" r="5.5" fill="#e2e8f0" style="animation-delay:0.9s"/>

  <!-- Split Packets -->
  <g class="v111"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:0.5s"/></g>
  <g class="v100"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:0.6s"/></g>
  <g class="v011"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:0.6s"/></g>
  <g class="v100"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:0.7s"/></g>
  <g class="v011"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:0.7s"/></g>
  <g class="v100"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:0.8s"/></g>
  <g class="v011"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:0.8s"/></g>
  <g class="v100"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:0.9s"/></g>
  <g class="v011"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:0.9s"/></g>
  <g class="v110"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:1.0s"/></g>
  <g class="v001"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:1.0s"/></g>
  <g class="v110"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:1.1s"/></g>
  <g class="v001"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:1.1s"/></g>
  <g class="v110"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:1.2s"/></g>
  <g class="v001"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:1.2s"/></g>
  <g class="v110"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:1.3s"/></g>
  <g class="v001"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:1.3s"/></g>
  <g class="v110"><circle class="p u" cx="430" cy="190" r="5.5" fill="#60a5fa" style="animation-delay:1.4s"/></g>
  <g class="v001"><circle class="p d" cx="430" cy="214" r="5.5" fill="#fbbf24" style="animation-delay:1.4s"/></g>

  <!-- Boxes -->
  <rect x="40" y="170" width="120" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="100" y="207" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Pengguna</text>

  <rect x="300" y="150" width="130" height="104" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="365" y="198" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Load Balancer</text>
  <text x="365" y="219" font-size="12" fill="#94a3b8" text-anchor="middle">atur bobot traffic</text>

  <rect x="590" y="62" width="170" height="96" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="675" y="92" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">v1</text>
  <text x="675" y="112" font-size="12" fill="#94a3b8" text-anchor="middle">versi stabil (control)</text>

  <rect x="590" y="250" width="170" height="96" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="675" y="280" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">v2</text>
  <text x="675" y="300" font-size="12" fill="#94a3b8" text-anchor="middle">canary</text>

  <!-- Percentage Counters -->
  <g class="s1"><text x="675" y="142" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle">90%</text></g>
  <g class="s2"><text x="675" y="142" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle">50%</text></g>
  <g class="s3"><text x="675" y="142" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle">0%</text></g>

  <g class="s1"><text x="675" y="330" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">10%</text></g>
  <g class="s2"><text x="675" y="330" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">50%</text></g>
  <g class="s3"><text x="675" y="330" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">100%</text></g>

  <!-- Footer -->
  <text x="32" y="382" font-size="13" fill="#94a3b8">Naik bertahap 10% → 50% → 100% sambil membandingkan metrik canary dengan control</text>
</svg>
