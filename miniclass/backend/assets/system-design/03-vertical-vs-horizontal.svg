<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="860" height="380" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <text x="430" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Vertical Scaling (Scale Up) vs Horizontal Scaling (Scale Out)
  </text>
  <text x="430" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Dua strategi utama saat server mulai tidak kuat menampung lonjakan traffic
  </text>

  <!-- Left Card: Vertical Scaling -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="365" height="260" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    
    <rect x="20" y="16" width="165" height="24" rx="12" fill="#78350f"/>
    <text x="102" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fde68a">
      VERTICAL (SCALE UP)
    </text>

    <!-- Visual: Small to Huge Server -->
    <g transform="translate(30, 55)">
      <!-- Small box -->
      <rect x="10" y="20" width="60" height="70" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="40" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">2 CPU</text>
      <text x="40" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">4GB RAM</text>

      <!-- Arrow -->
      <line x1="85" y1="55" x2="135" y2="55" stroke="#f59e0b" stroke-width="2"/>
      <polygon points="135,50 145,55 135,60" fill="#f59e0b"/>

      <!-- Monster box -->
      <rect x="160" y="0" width="130" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="225" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">64 CPU</text>
      <text x="225" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">256GB RAM</text>
      <text x="225" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">Beli hardware raksasa</text>
    </g>

    <!-- Bullets -->
    <g transform="translate(25, 185)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="0" y="0" fill="#10b981">✓ Kode tidak perlu diubah sama sekali</text>
      <text x="0" y="22" fill="#ef4444">✗ Biaya naik eksponensial (sangat mahal)</text>
      <text x="0" y="44" fill="#ef4444">✗ Ada batas fisik hardware &amp; butuh restart/downtime</text>
    </g>
  </g>

  <!-- Right Card: Horizontal Scaling -->
  <g transform="translate(455, 85)" filter="url(#shadow)">
    <rect width="365" height="260" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    
    <rect x="20" y="16" width="180" height="24" rx="12" fill="#0c4a6e"/>
    <text x="110" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#bae6fd">
      HORIZONTAL (SCALE OUT)
    </text>

    <!-- Visual: 1 Server to Multiple Behind LB -->
    <g transform="translate(30, 55)">
      <!-- Load Balancer -->
      <rect x="10" y="35" width="80" height="40" rx="6" fill="#0369a1" stroke="#38bdf8"/>
      <text x="50" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f8fafc">LOAD</text>
      <text x="50" y="67" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e0f2fe">BALANCER</text>

      <!-- Lines to servers -->
      <line x1="90" y1="45" x2="140" y2="20" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="90" y1="55" x2="140" y2="55" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="90" y1="65" x2="140" y2="90" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- 3 Small servers -->
      <rect x="145" y="5" width="140" height="28" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="215" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e0f2fe">App Server 1 (4GB)</text>

      <rect x="145" y="41" width="140" height="28" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="215" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e0f2fe">App Server 2 (4GB)</text>

      <rect x="145" y="77" width="140" height="28" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="215" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e0f2fe">App Server 3 (4GB)</text>
    </g>

    <!-- Bullets -->
    <g transform="translate(25, 185)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="0" y="0" fill="#10b981">✓ Skalabilitas hampir tanpa batas (tambah node)</text>
      <text x="0" y="22" fill="#10b981">✓ High Availability (1 server mati, server lain gantiin)</text>
      <text x="0" y="44" fill="#f59e0b">! Butuh arsitektur stateless &amp; load balancer</text>
    </g>
  </g>
</svg>
