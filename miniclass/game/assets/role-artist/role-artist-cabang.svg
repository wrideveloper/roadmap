<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-labelledby="role-artist-cabang-title role-artist-cabang-desc">
  <title id="role-artist-cabang-title">Lima cabang pekerjaan game artist beserta artefak yang diserahkan</title>
  <desc id="role-artist-cabang-desc">Enam kotak: UI artist, environment artist, technical artist, VFX artist, technical animator, dan pekerjaan di luar game.</desc>
  <rect width="720" height="366" fill="#f5f5f5"/>
  <text x="24" y="26" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.16em" fill="#5a6580">CABANG PEKERJAAN</text>
  <text x="24" y="52" font-family="'Instrument Serif', 'Liberation Serif', Georgia, serif" font-size="22" fill="#2d3142">Satu kemampuan, lima bentuk hasil</text>

  <rect x="24" y="86" width="216" height="96" rx="6" fill="#f1e7e4" stroke="#bf4520" stroke-width="1"/>
  <text x="132" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">UI Artist</text>
  <text x="132" y="136" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">mockup, tombol, HUD</text>
  <text x="132" y="152" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" fill="#5a6580">artefak: PNG + prefab</text>

  <rect x="252" y="86" width="216" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
  <text x="360" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Environment Artist</text>
  <text x="360" y="136" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">tileset, tilemap, prop</text>
  <text x="360" y="152" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" fill="#5a6580">artefak: satu layar map</text>

  <rect x="480" y="86" width="216" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
  <text x="588" y="116" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Technical Artist</text>
  <text x="588" y="136" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">material, shader, efek</text>
  <text x="588" y="152" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" fill="#5a6580">artefak: shader + komponen</text>

  <rect x="24" y="194" width="216" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
  <text x="132" y="224" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">VFX Artist</text>
  <text x="132" y="244" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">partikel, sparkle, ledakan</text>
  <text x="132" y="260" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" fill="#5a6580">artefak: satu efek skill</text>

  <rect x="252" y="194" width="216" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
  <text x="360" y="224" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Technical Animator</text>
  <text x="360" y="244" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">state machine, rig 2D</text>
  <text x="360" y="260" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" fill="#5a6580">artefak: transisi antar-state</text>

  <rect x="480" y="194" width="216" height="96" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="588" y="224" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Di luar game</text>
  <text x="588" y="244" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" fill="#4f5d75">ilustrasi, branding, UI</text>
  <text x="588" y="260" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" fill="#5a6580">artefak: studi kasus</text>

  <line x1="24" y1="312" x2="696" y2="312" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="24" y="330" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" fill="#5a6580">Satu cabang yang benar-benar jalan lebih berguna daripada lima yang setengah jadi.</text>
  <text x="24" y="344" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" fill="#5a6580">Nama jabatan berbeda antar-studio; bentuk artefaknya tidak.</text>
</svg>
