<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
  <title>Strategi Shadow: Salinan traffic dikirim ke v2, responsnya dibuang</title>
  <desc>Pengguna mengirim request ke router yang meneruskannya ke v1 (jalur utama) dan mengembalikan respons v1 ke pengguna. Di saat bersamaan, salinan request digandakan ke v2 (jalur bayangan putus-putus), dan respons dari v2 dibuang sehingga pengguna tidak terdampak.</desc>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Smooth 3.6s continuous round-trip and shadow branch cycle */
    .req-in {
      opacity: 0;
      animation: reqIn 3.6s linear infinite;
    }
    @keyframes reqIn {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      4%   { opacity: 1; }
      22%  { opacity: 1; }
      26%  { opacity: 0; transform: translate(116px, 0px); }
      100% { opacity: 0; transform: translate(116px, 0px); }
    }

    .req-v1 {
      opacity: 0;
      animation: reqV1 3.6s linear infinite;
    }
    @keyframes reqV1 {
      0%, 24%   { opacity: 0; transform: translate(0px, 0px); }
      28%       { opacity: 1; }
      49%       { opacity: 1; }
      53%       { opacity: 0; transform: translate(152px, -48px); }
      100%      { opacity: 0; transform: translate(152px, -48px); }
    }

    .res-v1 {
      opacity: 0;
      animation: resV1 3.6s linear infinite;
    }
    @keyframes resV1 {
      0%, 53%   { opacity: 0; transform: translate(0px, 0px); }
      57%       { opacity: 1; }
      75%       { opacity: 1; transform: translate(-152px, 48px); }
      93%       { opacity: 1; transform: translate(-268px, 48px); }
      97%, 100% { opacity: 0; transform: translate(-268px, 48px); }
    }

    .req-v2 {
      opacity: 0;
      animation: reqV2 3.6s linear infinite;
    }
    @keyframes reqV2 {
      0%, 24%   { opacity: 0; transform: translate(0px, 0px); }
      28%       { opacity: 0.85; }
      51%       { opacity: 0.65; }
      55%       { opacity: 0; transform: translate(152px, 114px); }
      100%      { opacity: 0; transform: translate(152px, 114px); }
    }

    .res-drop {
      opacity: 0;
      animation: resDrop 3.6s ease-in infinite;
    }
    @keyframes resDrop {
      0%, 55%   { opacity: 0; transform: translate(0px, 0px) scale(1); }
      60%       { opacity: 0.8; transform: translate(-30px, 8px) scale(0.95); }
      82%       { opacity: 0.6; transform: translate(-92px, 24px) scale(0.75); }
      90%, 100% { opacity: 0; transform: translate(-92px, 34px) scale(0.3); }
    }

    .stagger { animation-delay: 1.8s; }

    @media (prefers-reduced-motion: reduce) {
      .req-in, .req-v1, .res-v1, .req-v2, .res-drop {
        animation: none !important;
        opacity: 0;
      }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#a78bfa"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="18" fill="#0f172a"/>

  <!-- Header -->
  <text x="32" y="40" font-size="18" font-weight="700" fill="#e2e8f0">Strategi Shadow: gladi bersih tanpa penonton</text>
  <text x="32" y="65" font-size="14" font-weight="500" fill="#94a3b8">v1 melayani pengguna secara nyata; salinan request dikirim ke v2 lalu responsnya dibuang</text>

  <!-- Primary Solid Lines -->
  <g stroke="#60a5fa" stroke-width="2.5" fill="none">
    <line x1="156" y1="154" x2="268" y2="154" marker-end="url(#arr-blue)"/>
    <line x1="272" y1="176" x2="160" y2="176" stroke="#34d399" marker-end="url(#arr-green)"/>
    <line x1="404" y1="146" x2="552" y2="98" marker-end="url(#arr-blue)"/>
    <line x1="556" y1="118" x2="408" y2="166" stroke="#34d399"/>
  </g>

  <!-- Shadow Dashed Lines -->
  <g fill="none">
    <line x1="404" y1="184" x2="552" y2="294" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-purple)"/>
    <line x1="556" y1="316" x2="468" y2="338" stroke="#f87171" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr-red)"/>
  </g>

  <!-- Labels on Paths -->
  <text x="466" y="102" font-size="11.5" font-weight="600" fill="#60a5fa" text-anchor="middle">jalur utama</text>
  <text x="454" y="252" font-size="11.5" font-weight="600" fill="#a78bfa" text-anchor="middle">salinan (mirror)</text>

  <!-- Animated Packets Stream 1 -->
  <circle class="req-in" cx="156" cy="154" r="5.5" fill="#60a5fa"/>
  <circle class="req-v1" cx="404" cy="146" r="5.5" fill="#60a5fa"/>
  <circle class="res-v1" cx="556" cy="118" r="5.5" fill="#34d399"/>
  <circle class="req-v2" cx="404" cy="184" r="5" fill="#a78bfa"/>
  <circle class="res-drop" cx="556" cy="316" r="4.5" fill="#f87171"/>

  <!-- Animated Packets Stream 2 (Staggered 1.8s) -->
  <circle class="req-in stagger" cx="156" cy="154" r="5.5" fill="#60a5fa"/>
  <circle class="req-v1 stagger" cx="404" cy="146" r="5.5" fill="#60a5fa"/>
  <circle class="res-v1 stagger" cx="556" cy="118" r="5.5" fill="#34d399"/>
  <circle class="req-v2 stagger" cx="404" cy="184" r="5" fill="#a78bfa"/>
  <circle class="res-drop stagger" cx="556" cy="316" r="4.5" fill="#f87171"/>

  <!-- Pengguna Box -->
  <rect x="36" y="133" width="120" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="96" y="164" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Pengguna</text>
  <text x="96" y="183" font-size="11.5" fill="#34d399" text-anchor="middle">terima respons v1</text>

  <!-- Router / Mirror Proxy Box -->
  <rect x="272" y="123" width="132" height="84" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="338" y="161" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Router</text>
  <text x="338" y="181" font-size="11.5" fill="#a78bfa" text-anchor="middle">duplikasi request</text>

  <!-- v1 Box -->
  <rect x="556" y="68" width="204" height="92" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="658" y="100" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">v1 (Produksi)</text>
  <text x="658" y="122" font-size="12" fill="#cbd5e1" text-anchor="middle">melayani traffic nyata</text>
  <text x="658" y="144" font-size="11.5" font-weight="600" fill="#34d399" text-anchor="middle">respons dikirim ke user</text>

  <!-- v2 Box -->
  <rect x="556" y="250" width="204" height="92" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="658" y="282" font-size="18" font-weight="700" fill="#a78bfa" text-anchor="middle">v2 (Shadow)</text>
  <text x="658" y="304" font-size="12" fill="#94a3b8" text-anchor="middle">uji performa &amp; error</text>
  <text x="658" y="326" font-size="11.5" font-weight="600" fill="#f87171" text-anchor="middle">respons tidak dipakai</text>

  <!-- Discard / Trash Bin Box -->
  <g transform="translate(390, 314)">
    <rect x="-66" y="0" width="132" height="44" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <path d="M -46 15 L -32 15 M -42 15 L -42 12 L -36 12 L -36 15 M -44 17 L -43 31 L -35 31 L -34 17" stroke="#f87171" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="20" font-size="11.5" font-weight="700" fill="#fca5a5" text-anchor="middle">Dibuang</text>
    <text x="12" y="34" font-size="10" fill="#94a3b8" text-anchor="middle">respons v2</text>
  </g>

  <!-- Footer -->
  <text x="32" y="382" font-size="13" fill="#94a3b8">Menguji v2 dengan beban traffic asli tanpa risiko ke user — waspadai efek samping tulis DB/email</text>
</svg>
