<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
  <title>Strategi Blue-Green: Dua panggung kembar, satu saklar router</title>
  <desc>Dua lingkungan kembar, Blue (v1) dan Green (v2). Mula-mula pengguna dilayani Blue sementara Green diuji penguji internal. Lalu saklar router berpindah ke Green sehingga Blue masuk mode siaga rollback. Siklus juga menunjukkan rollback instan saat saklar dikembalikan ke Blue.</desc>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* 12s cycle:
       0-33.3%: Phase 1 - Traffic to Blue (v1), QA tests Green (v2)
       33.3-70%: Phase 2 - Switch flips to Green (v2), Blue stands by (gray)
       70-100%: Phase 3 - Instant Rollback! Switch flips back to Blue (v1)
    */
    .st-p1 { animation: stP1 12s ease-in-out infinite; }
    .st-p2 { animation: stP2 12s ease-in-out infinite; }
    .st-p3 { animation: stP3 12s ease-in-out infinite; }

    @keyframes stP1 {
      0%, 30%   { opacity: 1; }
      34%, 96%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes stP2 {
      0%, 31%   { opacity: 0; }
      35%, 67%  { opacity: 1; }
      71%, 100% { opacity: 0; }
    }
    @keyframes stP3 {
      0%, 68%   { opacity: 0; }
      72%, 96%  { opacity: 1; }
      100%      { opacity: 0; }
    }

    /* Blue active during Phase 1 and Phase 3; Standby during Phase 2 */
    .blue-active { animation: blueAct 12s ease-in-out infinite; }
    .blue-idle   { animation: blueIdl 12s ease-in-out infinite; }

    @keyframes blueAct {
      0%, 30%   { opacity: 1; }
      34%, 67%  { opacity: 0; }
      71%, 100% { opacity: 1; }
    }
    @keyframes blueIdl {
      0%, 30%   { opacity: 0; }
      34%, 67%  { opacity: 1; }
      71%, 100% { opacity: 0; }
    }

    /* Green active during Phase 2; Staging/Standby during Phase 1 and Phase 3 */
    .green-active { animation: greenAct 12s ease-in-out infinite; }
    .green-idle   { animation: greenIdl 12s ease-in-out infinite; }

    @keyframes greenAct {
      0%, 31%   { opacity: 0; }
      35%, 67%  { opacity: 1; }
      71%, 100% { opacity: 0; }
    }
    @keyframes greenIdl {
      0%, 31%   { opacity: 1; }
      35%, 67%  { opacity: 0; }
      71%, 100% { opacity: 1; }
    }

    /* Continuous user to router packets */
    .u-pkt {
      opacity: 0;
      animation: uToR 1.2s linear infinite;
    }
    @keyframes uToR {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translate(118px, 0px); }
    }

    /* Router to Blue packets */
    .r-blue {
      opacity: 0;
      animation: rToBlue 1.2s linear infinite;
    }
    @keyframes rToBlue {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translate(152px, -44px); }
    }

    /* Router to Green packets */
    .r-green {
      opacity: 0;
      animation: rToGreen 1.2s linear infinite;
    }
    @keyframes rToGreen {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translate(152px, 118px); }
    }

    /* QA Tester to Green packets */
    .qa-pkt {
      opacity: 0;
      animation: qaToGreen 1.5s linear infinite;
    }
    @keyframes qaToGreen {
      0%   { opacity: 0; transform: translate(0px, 0px); }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translate(152px, 0px); }
    }

    .d0 { animation-delay: 0.0s; }
    .d1 { animation-delay: 0.4s; }
    .d2 { animation-delay: 0.8s; }

    @media (prefers-reduced-motion: reduce) {
      .st-p1, .st-p3, .blue-active, .green-idle, .u-pkt, .r-blue, .r-green, .qa-pkt {
        animation: none !important;
        opacity: 0;
      }
      .st-p2, .blue-idle, .green-active {
        animation: none !important;
        opacity: 1;
      }
    }
  </style>

  <rect width="800" height="400" rx="18" fill="#0f172a"/>

  <!-- Header -->
  <text x="32" y="40" font-size="18" font-weight="700" fill="#e2e8f0">Strategi Blue-Green: dua panggung, satu saklar</text>
  <g class="st-p1">
    <text x="32" y="65" font-size="14" font-weight="500" fill="#60a5fa">Tahap 1 · Blue (v1) melayani pengguna; Green (v2) diuji penguji internal</text>
  </g>
  <g class="st-p2">
    <text x="32" y="65" font-size="14" font-weight="500" fill="#34d399">Tahap 2 · Saklar pindah ke Green (v2); Blue siaga untuk rollback</text>
  </g>
  <g class="st-p3">
    <text x="32" y="65" font-size="14" font-weight="500" fill="#fbbf24">Tahap 3 · Rollback instan: saklar dikembalikan ke Blue (v1)</text>
  </g>

  <!-- Base Paths -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <line x1="156" y1="168" x2="274" y2="168"/>
    <line x1="404" y1="158" x2="556" y2="114"/>
    <line x1="404" y1="178" x2="556" y2="296"/>
    <line x1="404" y1="306" x2="556" y2="306"/>
  </g>

  <!-- Highlighted Active Switch Line -->
  <g class="blue-active">
    <line x1="404" y1="158" x2="556" y2="114" stroke="#60a5fa" stroke-width="2.5"/>
  </g>
  <g class="green-active">
    <line x1="404" y1="178" x2="556" y2="296" stroke="#34d399" stroke-width="2.5"/>
  </g>

  <!-- User -> Router Packets -->
  <circle class="u-pkt d0" cx="156" cy="168" r="5.5" fill="#e2e8f0"/>
  <circle class="u-pkt d1" cx="156" cy="168" r="5.5" fill="#e2e8f0"/>
  <circle class="u-pkt d2" cx="156" cy="168" r="5.5" fill="#e2e8f0"/>

  <!-- Router -> Blue Packets -->
  <g class="blue-active">
    <circle class="r-blue d0" cx="404" cy="158" r="5.5" fill="#60a5fa"/>
    <circle class="r-blue d1" cx="404" cy="158" r="5.5" fill="#60a5fa"/>
    <circle class="r-blue d2" cx="404" cy="158" r="5.5" fill="#60a5fa"/>
  </g>

  <!-- Router -> Green Packets -->
  <g class="green-active">
    <circle class="r-green d0" cx="404" cy="178" r="5.5" fill="#34d399"/>
    <circle class="r-green d1" cx="404" cy="178" r="5.5" fill="#34d399"/>
    <circle class="r-green d2" cx="404" cy="178" r="5.5" fill="#34d399"/>
  </g>

  <!-- QA -> Green Smoke Test Packets -->
  <g class="st-p1">
    <circle class="qa-pkt d0" cx="404" cy="306" r="5" fill="#fbbf24"/>
    <circle class="qa-pkt d1" cx="404" cy="306" r="5" fill="#fbbf24"/>
  </g>

  <!-- Pengguna Box -->
  <rect x="40" y="136" width="116" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="98" y="173" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Pengguna</text>

  <!-- Router / Saklar Box -->
  <rect x="274" y="122" width="130" height="92" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="339" y="158" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Router</text>
  <g class="blue-active">
    <rect x="292" y="172" width="94" height="24" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
    <text x="339" y="188" class="mono" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">→ BLUE</text>
  </g>
  <g class="green-active">
    <rect x="292" y="172" width="94" height="24" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="339" y="188" class="mono" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">→ GREEN</text>
  </g>

  <!-- Penguji (QA) Box -->
  <g class="st-p1">
    <rect x="274" y="276" width="130" height="60" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="339" y="303" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Penguji</text>
    <text x="339" y="321" font-size="11.5" fill="#94a3b8" text-anchor="middle">uji Green dulu</text>
  </g>
  <g class="st-p2">
    <rect x="274" y="276" width="130" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.45"/>
    <text x="339" y="303" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Penguji</text>
    <text x="339" y="321" font-size="11.5" fill="#64748b" text-anchor="middle">pengujian selesai</text>
  </g>
  <g class="st-p3">
    <rect x="274" y="276" width="130" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.45"/>
    <text x="339" y="303" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Penguji</text>
    <text x="339" y="321" font-size="11.5" fill="#64748b" text-anchor="middle">investigasi v2</text>
  </g>

  <!-- BLUE ENVIRONMENT (Top Right) -->
  <g class="blue-active">
    <rect x="556" y="74" width="204" height="96" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="658" y="106" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">Blue (v1)</text>
    <text x="658" y="128" font-size="12" fill="#cbd5e1" text-anchor="middle">lingkungan aktif</text>
    <text x="658" y="152" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">100% TRAFFIC</text>
  </g>
  <g class="blue-idle">
    <rect x="556" y="74" width="204" height="96" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.65"/>
    <text x="658" y="106" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="middle">Blue (v1)</text>
    <text x="658" y="128" font-size="12" fill="#64748b" text-anchor="middle">siaga rollback</text>
    <text x="658" y="152" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">0% TRAFFIC</text>
  </g>

  <!-- GREEN ENVIRONMENT (Bottom Right) -->
  <g class="green-idle">
    <rect x="556" y="246" width="204" height="96" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
    <text x="658" y="278" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="middle">Green (v2)</text>
    <text x="658" y="300" font-size="12" fill="#64748b" text-anchor="middle">bangku cadangan</text>
    <text x="658" y="324" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">0% PUBLIC</text>
  </g>
  <g class="green-active">
    <rect x="556" y="246" width="204" height="96" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="658" y="278" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">Green (v2)</text>
    <text x="658" y="300" font-size="12" fill="#cbd5e1" text-anchor="middle">lingkungan aktif</text>
    <text x="658" y="324" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">100% TRAFFIC</text>
  </g>

  <!-- Footer -->
  <text x="32" y="380" font-size="13" fill="#94a3b8">Perpindahan sekaligus dan rollback instan, membutuhkan dua lingkungan produksi identik</text>
</svg>
