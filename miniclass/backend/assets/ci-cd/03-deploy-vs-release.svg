<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
  <title>Deploy vs Release: Garis Waktu Dua Lapis</title>
  <desc>Garis waktu dua lapis yang memisahkan Deploy dan Release. Pada lapis atas (Deploy), kode versi baru v2 dipasang ke server pada Hari 1 dengan ikon kabel terpasang. Pada lapis bawah (Release), saklar feature flag dinyalakan bertahap dari 0% menjadi 10% pada Hari 4 hingga 100% pada Hari 5, menunjukkan bahwa jeda di antara deploy dan release bisa berhari-hari.</desc>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* 12s smooth cycle across 4 stages:
       Stage 1 (0% - 25%): Hari 1 - Deploy v2 (cable plugged), Flag 0%
       Stage 2 (25% - 50%): Hari 2-3 - Time gap (code in prod, flag still 0%)
       Stage 3 (50% - 75%): Hari 4 - Release 10% (canary flag)
       Stage 4 (75% - 100%): Hari 5 - Release 100% (full release)
    */
    .st1 { animation: vis1 12s ease-in-out infinite; }
    .st2 { animation: vis2 12s ease-in-out infinite; }
    .st3 { animation: vis3 12s ease-in-out infinite; }
    .st4 { animation: vis4 12s ease-in-out infinite; }

    @keyframes vis1 {
      0%, 22%   { opacity: 1; }
      26%, 96%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes vis2 {
      0%, 23%   { opacity: 0; }
      27%, 47%  { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes vis3 {
      0%, 48%   { opacity: 0; }
      52%, 72%  { opacity: 1; }
      76%, 100% { opacity: 0; }
    }
    @keyframes vis4 {
      0%, 73%   { opacity: 0; }
      77%, 96%  { opacity: 1; }
      100%      { opacity: 0; }
    }

    /* Cable plug animation on Deploy card (plugs in smoothly at start of cycle) */
    .plug-male {
      animation: plugIn 12s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes plugIn {
      0%, 4%    { transform: translateX(-8px); }
      12%, 95%  { transform: translateX(0px); }
      100%      { transform: translateX(-8px); }
    }

    /* Milestone cards highlight sequentially */
    .card-deploy {
      animation: glowDeploy 12s ease-in-out infinite;
    }
    @keyframes glowDeploy {
      0%, 22%   { filter: brightness(1.25); }
      26%, 95%  { filter: brightness(1); }
      100%      { filter: brightness(1.25); }
    }

    .card-gap {
      animation: glowGap 12s ease-in-out infinite;
    }
    @keyframes glowGap {
      0%, 23%   { opacity: 0.65; }
      27%, 47%  { opacity: 1; }
      51%, 100% { opacity: 0.65; }
    }

    .card-f0 {
      animation: glowF0 12s ease-in-out infinite;
    }
    @keyframes glowF0 {
      0%, 47%   { opacity: 1; }
      51%, 95%  { opacity: 0.55; }
      100%      { opacity: 1; }
    }

    .card-f10 {
      animation: glowF10 12s ease-in-out infinite;
    }
    @keyframes glowF10 {
      0%, 48%   { opacity: 0.4; }
      52%, 72%  { opacity: 1; }
      76%, 95%  { opacity: 0.65; }
      100%      { opacity: 0.4; }
    }

    .card-f100 {
      animation: glowF100 12s ease-in-out infinite;
    }
    @keyframes glowF100 {
      0%, 73%   { opacity: 0.4; }
      77%, 96%  { opacity: 1; }
      100%      { opacity: 0.4; }
    }

    /* Timeline playhead moving across Hari 1 -> Hari 2-3 -> Hari 4 -> Hari 5 */
    .playhead {
      animation: moveCursor 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes moveCursor {
      0%, 20%   { transform: translateX(0px); }
      28%, 46%  { transform: translateX(160px); }
      54%, 71%  { transform: translateX(320px); }
      79%, 95%  { transform: translateX(480px); }
      100%      { transform: translateX(0px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .st1, .st2, .st4, .plug-male, .card-deploy, .card-gap, .card-f0, .card-f10, .card-f100, .playhead {
        animation: none !important;
      }
      .st1, .st2, .st4 { opacity: 0; }
      .st3 { opacity: 1; }
      .card-gap, .card-f0, .card-f10, .card-f100 { opacity: 1; }
    }
  </style>

  <defs>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Main Canvas -->
  <rect width="800" height="400" rx="18" fill="#0f172a"/>

  <!-- Header -->
  <text x="32" y="38" font-size="18" font-weight="700" fill="#e2e8f0">Deploy vs Release: kabel terpasang, saklar menyusul</text>
  <g class="st1">
    <text x="32" y="62" font-size="13.5" font-weight="500" fill="#60a5fa">Hari 1 · Deploy: kode v2 terpasang di server, tapi saklar flag masih OFF (0%)</text>
  </g>
  <g class="st2">
    <text x="32" y="62" font-size="13.5" font-weight="500" fill="#fbbf24">Hari 2 – Hari 3 · Jeda aman: kode sudah di produksi, pengguna belum terdampak</text>
  </g>
  <g class="st3">
    <text x="32" y="62" font-size="13.5" font-weight="500" fill="#fbbf24">Hari 4 · Release bertahap: saklar flag dibuka untuk 10% pengguna</text>
  </g>
  <g class="st4">
    <text x="32" y="62" font-size="13.5" font-weight="500" fill="#34d399">Hari 5 · Release penuh: saklar flag 100% menyala tanpa perlu deploy ulang</text>
  </g>

  <!-- LEFT LAYER LABELS -->
  <!-- Layer 1: DEPLOY -->
  <g transform="translate(32, 98)">
    <rect x="0" y="0" width="128" height="72" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="64" y="22" class="mono" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">LAPIS 1</text>
    <text x="64" y="42" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Deploy</text>
    <text x="64" y="59" font-size="11" fill="#94a3b8" text-anchor="middle">kode naik ke server</text>
  </g>

  <!-- Layer 2: RELEASE -->
  <g transform="translate(32, 238)">
    <rect x="0" y="0" width="128" height="72" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
    <text x="64" y="22" class="mono" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">LAPIS 2</text>
    <text x="64" y="42" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Release</text>
    <text x="64" y="59" font-size="11" fill="#94a3b8" text-anchor="middle">saklar flag dibuka</text>
  </g>

  <!-- LAYER 1 TRACK (DEPLOY: y=134) -->
  <line x1="176" y1="134" x2="764" y2="134" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- Active solid line from Deploy point (x=235) to end (x=760) -->
  <line x1="235" y1="134" x2="760" y2="134" stroke="#60a5fa" stroke-width="3" marker-end="url(#arr-sky)"/>

  <!-- Deploy Node Card at x=235, y=134 -->
  <g transform="translate(235, 134)">
    <g class="card-deploy">
      <rect x="-66" y="-36" width="132" height="72" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
      <!-- Cable & Plug Icon -->
      <g transform="translate(0, -13)">
        <!-- Socket (right) -->
        <rect x="4" y="-8" width="15" height="16" rx="3" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
        <line x1="19" y1="0" x2="29" y2="0" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
        <circle cx="11.5" cy="0" r="2.2" fill="#38bdf8"/>
        <!-- Animated Male Plug (left) -->
        <g class="plug-male">
          <line x1="-29" y1="0" x2="-17" y2="0" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
          <rect x="-17" y="-7" width="13" height="14" rx="2.5" fill="#3b82f6"/>
          <line x1="-4" y1="-3.5" x2="4" y2="-3.5" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
          <line x1="-4" y1="3.5" x2="4" y2="3.5" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
      <text x="0" y="13" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Kabel Terpasang</text>
      <text x="0" y="27" class="mono" font-size="10" fill="#93c5fd" text-anchor="middle">v2 di produksi</text>
    </g>
  </g>

  <!-- Continuous Deployed Banner along upper track -->
  <g transform="translate(535, 134)">
    <rect x="-182" y="-15" width="364" height="30" rx="15" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="0" y="4" font-size="11.5" font-weight="600" fill="#93c5fd" text-anchor="middle">Artefak v2 sudah aktif di server (tanpa deploy ulang)</text>
  </g>

  <!-- MIDDLE GAP ZONE (y=170 to y=238) -->
  <!-- Vertical milestone drop lines -->
  <line x1="235" y1="170" x2="235" y2="238" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="555" y1="149" x2="555" y2="238" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="715" y1="149" x2="715" y2="238" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Time Gap Bracket between Hari 1 (235) and Hari 4 (555) -->
  <g class="card-gap">
    <line x1="244" y1="204" x2="546" y2="204" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="244" y1="198" x2="244" y2="210" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="546" y1="198" x2="546" y2="210" stroke="#fbbf24" stroke-width="1.5"/>
    <g transform="translate(395, 204)">
      <rect x="-112" y="-13" width="224" height="26" rx="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="0" y="4" font-size="11.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Jeda bisa berhari-hari</text>
    </g>
  </g>

  <!-- LAYER 2 TRACK (RELEASE: y=274) -->
  <line x1="176" y1="274" x2="764" y2="274" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- Progressive Release Line -->
  <line x1="235" y1="274" x2="555" y2="274" stroke="#64748b" stroke-width="2.5"/>
  <line x1="555" y1="274" x2="760" y2="274" stroke="#34d399" stroke-width="3" marker-end="url(#arr-emerald)"/>

  <!-- Release Milestone 1: Flag 0% (x=235, y=274) -->
  <g transform="translate(235, 274)">
    <g class="card-f0">
      <rect x="-66" y="-36" width="132" height="72" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.8"/>
      <!-- Toggle Switch OFF -->
      <rect x="-22" y="-23" width="44" height="20" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-11" cy="-13" r="6.5" fill="#94a3b8"/>
      <text x="0" y="13" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">Flag 0%</text>
      <text x="0" y="27" font-size="10" fill="#94a3b8" text-anchor="middle">saklar mati (OFF)</text>
    </g>
  </g>

  <!-- Release Milestone 2: Flag 10% (x=555, y=274) -->
  <g transform="translate(555, 274)">
    <g class="card-f10">
      <rect x="-66" y="-36" width="132" height="72" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
      <!-- Toggle Switch PARTIAL (10%) -->
      <rect x="-22" y="-23" width="44" height="20" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="0" cy="-13" r="6.5" fill="#fbbf24"/>
      <text x="0" y="13" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Flag 10%</text>
      <text x="0" y="27" font-size="10" fill="#fde68a" text-anchor="middle">rilis bertahap</text>
    </g>
  </g>

  <!-- Release Milestone 3: Flag 100% (x=715, y=274) -->
  <g transform="translate(715, 274)">
    <g class="card-f100">
      <rect x="-66" y="-36" width="132" height="72" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
      <!-- Toggle Switch ON (100%) -->
      <rect x="-22" y="-23" width="44" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="11" cy="-13" r="6.5" fill="#34d399"/>
      <text x="0" y="13" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Flag 100%</text>
      <text x="0" y="27" font-size="10" fill="#6ee7b7" text-anchor="middle">semua pengguna</text>
    </g>
  </g>

  <!-- BOTTOM TIMELINE RULER (y=338) -->
  <line x1="185" y1="338" x2="760" y2="338" stroke="#334155" stroke-width="2"/>
  <circle cx="235" cy="338" r="4" fill="#60a5fa"/>
  <text x="235" y="356" class="mono" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Hari 1</text>

  <circle cx="395" cy="338" r="3.5" fill="#64748b"/>
  <text x="395" y="356" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Hari 2 – 3</text>

  <circle cx="555" cy="338" r="4" fill="#fbbf24"/>
  <text x="555" y="356" class="mono" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Hari 4</text>

  <circle cx="715" cy="338" r="4" fill="#34d399"/>
  <text x="715" y="356" class="mono" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Hari 5</text>

  <!-- Animated Timeline Cursor -->
  <g transform="translate(235, 338)">
    <g class="playhead">
      <circle cx="0" cy="0" r="7" fill="#e2e8f0" opacity="0.25"/>
      <circle cx="0" cy="0" r="4.5" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Footer -->
  <text x="32" y="384" font-size="13" fill="#94a3b8">Deploy memindahkan kode ke server; Release mengendalikan kapan fitur menyala bagi pengguna</text>
</svg>
