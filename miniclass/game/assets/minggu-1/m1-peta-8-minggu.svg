<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" role="img" aria-labelledby="peta-8-minggu-title peta-8-minggu-desc">
  <title id="peta-8-minggu-title">Delapan minggu miniclass terbagi dua fase</title>
  <desc id="peta-8-minggu-desc">Timeline delapan minggu: minggu 1 sampai 4 sesi bersama, gate di minggu 4, lalu minggu 5 sampai 8 kelas dan kelompok kecil.</desc>
  <rect width="720" height="414" fill="#f5f5f5"/>
<text x="24" y="26" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.16em" fill="#5a6580">PETA PROGRAM · 8 MINGGU</text>
<text x="24" y="52" font-family="'Instrument Serif', 'Liberation Serif', Georgia, serif" font-size="22" fill="#2d3142">Delapan minggu, dua fase</text>
<text x="24" y="72" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="10" fill="#4f5d75">Minggu 1–4 semua peserta bersama. Kelompok kecil dibentuk setelah gate.</text>
<text x="24" y="94" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.16em" fill="#5a6580">FASE BERSAMA — SEMUA PESERTA</text>
<line x1="24" y1="101" x2="696" y2="101" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<rect x="24" y="114" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="24" y="114" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="34" y="124" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="48" y="135" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M1</text>
<text x="34" y="157" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Ini kelas apa</text>
<text x="34" y="171" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">dan biayanya</text>
<text x="34" y="200" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ form onboarding</text>
<rect x="192" y="114" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="192" y="114" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="202" y="124" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="216" y="135" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M2</text>
<text x="202" y="157" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Cara belajar,</text>
<text x="202" y="171" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">cek laptop</text>
<text x="202" y="200" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ Unity terpasang</text>
<rect x="360" y="114" width="156" height="98" rx="6" fill="#f5f5f5"/>
<rect x="360" y="114" width="156" height="98" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="370" y="124" width="28" height="15" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
<text x="384" y="135" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" fill="#5a6580">M3</text>
<text x="370" y="157" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Tiga kelas:</text>
<text x="370" y="171" font-family="'Geist', 'Inter', 'Liberation Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2d3142">isi &amp; hasil</text>
<text x="370" y="200" font-family="'Geist Mono', 'Liberation Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75">→ pilihan kelas</text>
