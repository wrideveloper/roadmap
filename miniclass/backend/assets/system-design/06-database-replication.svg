<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="860" height="380" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <text x="430" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Database Replication: Read / Write Split
  </text>
  <text x="430" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Mayoritas aplikasi web adalah Read-Heavy (90% baca data, 10% nulis data)
  </text>

  <!-- App Servers Box -->
  <g transform="translate(50, 115)" filter="url(#shadow)">
    <rect width="210" height="170" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
      APP SERVERS
    </text>
    
    <g transform="translate(15, 55)" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      <rect x="0" y="0" width="180" height="38" rx="4" fill="#0f172a" stroke="#ef4444"/>
      <text x="10" y="24" fill="#fca5a5" font-weight="600">Write: INSERT, UPDATE, DEL</text>

      <rect x="0" y="50" width="180" height="38" rx="4" fill="#0f172a" stroke="#10b981"/>
      <text x="10" y="74" fill="#a7f3d0" font-weight="600">Read: SELECT queries</text>
    </g>
  </g>

  <!-- Arrow Write to Primary -->
  <g stroke="#ef4444" stroke-width="2" fill="none">
    <path d="M 260 145 L 360 145"/>
    <polygon points="360,140 370,145 360,150" fill="#ef4444"/>
  </g>
  <text x="315" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">
    Writes (10%)
  </text>

  <!-- Primary DB (Master) -->
  <g transform="translate(370, 95)" filter="url(#shadow)">
    <rect width="200" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="15" y="12" width="170" height="24" rx="4" fill="#7f1d1d"/>
    <text x="100" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">
      PRIMARY DB (MASTER)
    </text>
    <text x="15" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f8fafc">
      • Menerima semua Write
    </text>
    <text x="15" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      • Sumber kebenaran data
    </text>
    <text x="15" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444">
      • 1 Server saja (Consistency)
    </text>
  </g>

  <!-- Async Replication Line -->
  <g stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" fill="none">
    <path d="M 470 205 L 470 240 L 610 240"/>
    <polygon points="610,235 620,240 610,245" fill="#f59e0b"/>
  </g>
  <text x="535" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fde68a">
    Async Replication
  </text>

  <!-- Arrow Read to Replicas -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <path d="M 260 255 Q 400 310 610 280"/>
    <polygon points="610,275 620,280 611,285" fill="#10b981"/>
  </g>
  <text x="350" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">
    Reads (90% Traffic)
  </text>

  <!-- Read Replicas Box -->
  <g transform="translate(620, 160)" filter="url(#shadow)">
    <rect width="200" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="12" width="170" height="24" rx="4" fill="#064e3b"/>
    <text x="100" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">
      READ REPLICAS (SLAVES)
    </text>

    <!-- Replica Nodes -->
    <rect x="15" y="48" width="170" height="38" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      Replica 1 (ReadOnly)
    </text>

    <rect x="15" y="96" width="170" height="38" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      Replica 2 (ReadOnly)
    </text>
  </g>

  <!-- Bottom Tip -->
  <text x="430" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Hasilnya: Primary DB tetap enteng dan cepat karena tidak terbebani jutaan query SELECT dari user yang hanya membaca halaman.
  </text>
</svg>
